# XcodeGen project definition
# On a Mac / CI: brew install xcodegen && xcodegen generate
name: Pulse
options:
  bundleIdPrefix: com.pulse
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Pulse/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""                 # set via CI env or Xcode
    PRODUCT_BUNDLE_IDENTIFIER: com.pulse.mediaplayer

targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_NAME: Pulse
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.mediaplayer
        INFOPLIST_FILE: Pulse/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pulse/Pulse.entitlements
        SUPPORTS_XR_DESIGNED_FOR_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Pulse/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: Pulse plays music you import from the Files app.
        ITSAppUsesNonExemptEncryption: false

schemes:
  Pulse:
    build:
      targets:
        Pulse: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
