# GitHub Actions — build Pulse IPA on a macOS runner
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   BUILD_CERTIFICATE_BASE64      # .p12 certificate, base64-encoded
#   P12_PASSWORD                  # password for the .p12
#   KEYCHAIN_PASSWORD             # any random password for the temp keychain
#   PROVISIONING_PROFILE_BASE64   # .mobileprovision, base64-encoded
#   TEAM_ID                       # your 10-character Apple Team ID
#
# Optional:
#   BUNDLE_ID                     # defaults to com.pulse.mediaplayer
#
# How to create the base64 secrets (on any machine with openssl):
#   base64 -i Certificates.p12 | pbcopy          # macOS
#   base64 Certificates.p12 | clip               # Windows (Git Bash)
#   base64 -w0 Certificates.p12                  # Linux
# Same for the .mobileprovision file.
#
# Trigger: push a tag starting with "v" (e.g. v1.0.0) or run manually.

name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Archive & Export IPA
    runs-on: macos-14
    timeout-minutes: 45

    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID || 'com.pulse.mediaplayer' }}
      TEAM_ID: ${{ secrets.TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Apple certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(security cms -D -i $PP_PATH | plutil -extract UUID raw -)
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          echo "Installed profile UUID: $PP_UUID"

      - name: Patch export options with Team ID
        run: |
          plutil -replace teamID -string "$TEAM_ID" ci/ExportOptions-ad-hoc.plist
          plutil -replace signingStyle -string manual ci/ExportOptions-ad-hoc.plist

      - name: Build archive
        run: |
          set -e
          xcodebuild -project Pulse.xcodeproj \
            -scheme Pulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Pulse.xcarchive \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0.0" \
            | xcpretty || true

      - name: Export IPA
        run: |
          set -e
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Pulse.xcarchive \
            -exportOptionsPlist ci/ExportOptions-ad-hoc.plist \
            -exportPath $RUNNER_TEMP/export
          ls -la $RUNNER_TEMP/export

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-iOS
          path: |
            ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
